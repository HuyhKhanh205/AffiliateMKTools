# Builds the web app and publishes it to GitHub Pages:
#   https://huyhkhanh205.github.io/AffiliateMKTools
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy web

on:
  push:
    branches: [main, claude/dazzling-bohr-zf0hz0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Public by design (row level security protects the data). Never put secret keys here.
  EXPO_PUBLIC_SUPABASE_URL: https://ujaqushxozsnjpojalen.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_b10eW-yZHSG5MTFns-Za0Q_T8bThI1Z
  EXPO_PUBLIC_SITE_URL: https://huyhkhanh205.github.io/AffiliateMKTools
  EXPO_BASE_URL: /AffiliateMKTools

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest
      - run: npm run export:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
