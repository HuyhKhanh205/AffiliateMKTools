<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- The BASE_URL placeholders are filled in by scripts/postexport-web.mjs (e.g. "/AffiliateMKTools" on GitHub Pages, "" at a domain root). -->
    <link rel="manifest" href="%BASE_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%BASE_URL%/apple-touch-icon.png" />
    <!-- iOS: "Add to Home Screen" opens full screen like a native app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Affiliate Hub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#EE4D2D" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #f5f6fa;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Bạn cần bật JavaScript để dùng Affiliate Hub.</noscript>
    <div id="root"></div>
  </body>
</html>
